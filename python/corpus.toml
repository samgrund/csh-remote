# csh_remote command corpus.
#
# Success/failure markers used by CshRPC.execute(eval=True) to classify a
# command's outcome beyond the slash exit code.  csh returns
# SLASH_SUCCESS for most operational failures (e.g. a `ping` with no
# reply still exits 0), so the exit code alone cannot be trusted.
#
# Matching (all plain substring matches against the captured output):
#   1. ret != 0                                    -> failure (exit code)
#   2. a failure marker (entry's + global) matched -> failure
#   3. success markers defined but none matched    -> failure
#   4. otherwise, with a matching corpus entry     -> success
#      without a matching corpus entry             -> unknown
#      (ok then falls back to ret == 0)
#
# `names` are matched against the first word(s) of the command line,
# longest match wins (so "remote status" picks its own entry, not a
# hypothetical "remote" one).
#
# Extend by adding [[command]] entries.  Every marker below is a
# verbatim string printed by csh (or this APM); the '# source:'
# comments cite where it is printed so markers can be re-verified
# after a csh update.  Set $CSH_REMOTE_CORPUS to use a different
# corpus file altogether.

version = 1

# Markers applied to every command, regardless of corpus entry.
[global]
failure = [
	"No such command",                          
	"does not resolve to a valid CSP address",  
]

[[command]]
names = ["ping"]
success = ["Reply in "]  # "Reply in %d [ms]"
failure = ["No reply"]

[[command]]
names = ["ident"]
success = ["IDENT"]

[[command]]
names = ["ifstat"]
success = ["tx:"]
failure = ["No response", "missing interface name"]

[[command]]
names = ["peek", "poke"]
failure = [
	"missing address",
	"Failed to parse address",
	"missing length",
	"Failed to parse length",
	"No response",
]

[[command]]
names = ["get", "set", "list"]
failure = ["not found", "invalid parameter value"]

[[command]]
names = ["remote status"]
success = ["socket:"]
